.lit .bg{filter:brightness(.78) saturate(1.15) contrast(1.08)}
.lit.is-open .bg{filter:brightness(.42) saturate(1.1) blur(7px);transition:filter .9s ease}
@keyframes drift{0%{background-position:48% 40%}100%{background-position:54% 62%}}
.bgShade{background:radial-gradient(75% 42% at 50% 52%,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 80%),linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.7) 100%)}
.shimmer{opacity:0;transition:opacity 2s ease 1.2s;mix-blend-mode:screen}
.lit .shimmer{opacity:1}
.shimmer::before,.shimmer::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,rgba(255,255,255,0) 44%,rgba(190,235,255,.16) 49%,rgba(255,255,255,.34) 50%,rgba(190,235,255,.16) 51%,rgba(255,255,255,0) 56%);animation:glide 7s cubic-bezier(.45,0,.25,1) infinite}
.shimmer::after{background:linear-gradient(65deg,rgba(255,255,255,0) 46%,rgba(255,215,170,.14) 50%,rgba(255,255,255,0) 54%);animation-duration:11s;animation-delay:3s}
@keyframes glide{0%{transform:translate(-45%,-20%)}60%,100%{transform:translate(45%,20%)}}
.sparkles{opacity:0;transition:opacity 1.6s ease 1s}
.lit .sparkles{opacity:1}
.spk{position:absolute;display:block;transform:scale(0);opacity:0;animation-name:twinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.spk::before,.spk::after{content:"";position:absolute;left:50%;top:50%;border-radius:2px;transform:translate(-50%,-50%)}
.spk::before{width:100%;height:1.5px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0))}
.spk::after{width:1.5px;height:100%;background:linear-gradient(180deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0))}
.spk.dot::before{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(190,235,255,.8)}
.spk.dot::after{display:none}
.spk.star{filter:drop-shadow(0 0 4px rgba(200,240,255,.95))}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}45%{transform:scale(1) rotate(45deg);opacity:1}60%{transform:scale(.6) rotate(70deg);opacity:.7}}
.ambient,.detailBg,.vignette,.floor{position:absolute;inset:0;pointer-events:none}
.ambient{opacity:0;transition:opacity 2.6s ease .2s;mix-blend-mode:screen}
.lit .ambient{opacity:1}
.floor{top:auto;height:340px;background:linear-gradient(to top,rgba(255,60,25,.12),rgba(255,60,25,0));opacity:0;transition:opacity 2s ease .8s}
.lit .floor{opacity:1}
.vignette{background:radial-gradient(120% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.85) 100%)}
.detailBg{transition:opacity .9s ease}
.stage{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 460px}
.card{position:absolute;left:45px;top:365px;width:300px;height:190px;padding:0;margin:0;border:0;background:none;border-radius:16px;cursor:grab;transform-origin:50% 50%}
.card:focus-visible{outline:2px solid #fff;outline-offset:4px}
.face{position:absolute;inset:0;display:block;border-radius:16px;overflow:hidden;text-align:left;transition:box-shadow 1.8s ease .5s}
.face.has-art{background-position:center;background-repeat:no-repeat;background-size:cover}
.face.has-art .grooves,.face.has-art .flare,.face.has-art .rim,.face.has-art .crow,.face.has-art .chip,.face.has-art .num{display:none}
.face.art-im-infinite{background-color:#1d1e21;background-position:center!important;background-size:116% auto!important}
.lit .face{box-shadow:0 0 0 1px rgba(255,150,110,.35),0 0 46px -8px rgba(255,70,30,.6)}
.grooves{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,rgba(255,255,255,0) 1px 8px)}
.flare{position:absolute;inset:0}
.rim{position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,180,140,.35),inset 0 1px 0 rgba(255,225,205,.55),inset 0 -24px 40px rgba(0,0,0,.25)}
.crow{position:absolute;left:20px;right:18px;display:flex;align-items:center;justify-content:space-between}
.crow.top{top:16px}
.crow.bot{bottom:16px}
.cname{font-family:"Montserrat",sans-serif;font-weight:600;font-size:13px;letter-spacing:.22em;color:#fff}

<script>
// Minimal stand-in for the design runtime: state + batched re-render.
let __schedule = () => {};
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) {
    const patch = typeof p === 'function' ? p(this.state, this.props) : p;
    if (!patch) return;
    this.state = Object.assign({}, this.state, patch);
    __schedule();
  }
  forceUpdate() { __schedule(); }
}

class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { lit: false, active: 3, open: false, dragging: false, dx: 0, dy: 0, frozen: {}, reveal: false };
    this.drag = null;
    this.moved = false;
    this.timer = null;
  }

  componentDidMount() {
    this.timer = setTimeout(() => this.setState({ lit: true }), 400);
  }

  componentWillUnmount() {
    clearTimeout(this.timer);
  }

  data() {
    if (this._d) return this._d;
    const cards = [
      { id: 'coop-classic', art: 'coop-classic', name: 'CO-OPERATIVE BANK', tier: 'Visa Debit', last4: '3400', full: '4407 8300 4938 3400', exp: '05/21', g1: '#041a12', g2: '#0b5b39', g3: '#55b986' },
      { id: 'sc-priority', art: 'sc-priority', name: 'STANDARD CHARTERED', tier: 'Visa Infinite', last4: '0000', full: '4231 7900 1234 0000', exp: '12/18', g1: '#041634', g2: '#0b3d7a', g3: '#3fa9e0' },
      { id: 'credit', art: 'credit', name: 'CREDIT BANK', tier: 'Prepaid', last4: '8901', full: '4641 1234 5678 8901', exp: '12/22', g1: '#3d1704', g2: '#f46e16', g3: '#ffb12b' },
      { id: 'family', art: 'family', name: 'FAMILY BANK', tier: 'Visa', last4: '4239', full: '4239', exp: '—', g1: '#5f4704', g2: '#d1a313', g3: '#f6df7e' },
      { id: 'im-infinite', art: 'im-infinite', name: 'I&M BANK', tier: 'Visa Infinite', last4: '4054', full: '4054', exp: '—', g1: '#050505', g2: '#202124', g3: '#00a5b5' },
      { id: 'ncba', art: 'ncba', name: 'NCBA BANK', tier: 'Visa Debit', last4: '4321', full: '4567 8909 8765 4321', exp: '06/30', g1: '#141416', g2: '#3a3a3e', g3: '#1fa8e0' },
      { id: 'sbm-one', art: 'sbm-one', name: 'SBM BANK', tier: 'Visa Signature', last4: '7710', full: '4000 5500 0000 7710', exp: '—', g1: '#000000', g2: '#1c1c1c', g3: '#8a8a8a' }
    ];
    let seed = 20261004;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    const sparkles = [];
    for (let i = 0; i < 44; i++) {
      const star = rnd() < 0.45;
      const size = star ? 10 + rnd() * 16 : 6;
      sparkles.push({
        kind: star ? 'star' : 'dot',
        style: `left: ${(rnd() * 100).toFixed(1)}%; top: ${(rnd() * 100).toFixed(1)}%; width: ${size.toFixed(0)}px; height: ${size.toFixed(0)}px; animation-duration: ${(2.2 + rnd() * 3.4).toFixed(2)}s; animation-delay: ${(rnd() * 5).toFixed(2)}s`
      });
    }
    this._d = { cards, sparkles };
    return this._d;
  }

  stackT(d) {
    const ad = Math.abs(d);
    const a = Math.min(ad, 1);
    const sg = d < 0 ? -1 : (d > 0 ? 1 : 0);
    const far = Math.max(ad - 1, 0);
    // Side cards turn so their OUTER edge recedes into the distance (cover-flow),
    // and each step outward sits further back so inner cards always overlap outer ones.
    return {
      x: sg * (a * 118 + far * 26),
      y: -38 * (1 - a),
      z: -a * 140 - far * 80,
      ry: sg * a * 62,
      rz: 90,
      sc: 1
    };
  }

  onDown = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const r = e.currentTarget.getBoundingClientRect();
    this.drag = { x: e.clientX, y: e.clientY, axis: null, k: (r.width / 390) || 1 };
    this.moved = false;
  };

  onMove = (e) => {
    const g = this.drag;
    if (!g) return;
    const dx = (e.clientX - g.x) / g.k;
    const dy = (e.clientY - g.y) / g.k;
    if (!g.axis) {
      if (Math.hypot(dx, dy) < 8) return;
      g.axis = this.state.open ? 'y' : (Math.abs(dx) > Math.abs(dy) ? 'x' : 'y');
      this.moved = true;
    }
    if (g.axis === 'x') {
      this.setState({ dragging: true, dx: dx, dy: 0 });
    } else {
      const v = this.state.open ? Math.max(0, dy) : Math.min(0, dy);
      this.setState({ dragging: true, dx: 0, dy: v });
    }
  };

  onUp = () => {
    const g = this.drag;
    this.drag = null;
    if (!g || !g.axis) return;
    const s = this.state;
    const n = this.data().cards.length;

      el.frost.style.display = c.frozen ? 'flex' : 'none';
      el.dim.style.opacity = c.dim;
      el.sweep.style.animationDelay = c.sweepDelay + 'ms';
      el.shade.style.transitionDelay = c.shadeDelay + 'ms';
    });

    $('home').style.cssText = 'will-change: opacity; ' + v.homeStyle;
    $('labName').textContent = v.labName;
    // Home: the shown card's own total under its name, and the grand total across every card.
    const cardSum = (id) => acctsOf(id).reduce((sum, a) => sum + a.balance, 0);
    $('labSub').textContent = v.labSub + (loaded ? ' · ' + (totalHidden ? CUR + MASK : money(cardSum(v.labId))) : '');
    const allCards = comp.data().cards;
    const acctCount = allCards.reduce((n, c) => n + acctsOf(c.id).length, 0);
    $('atVal').textContent = !loaded ? (loadFailed ? '—' : '…') : totalHidden ? MASK : num(allCards.reduce((sum, c) => sum + cardSum(c.id), 0));
    $('atSub').textContent = !loaded ? (loadFailed ? "Couldn't load records" : 'Loading…')
      : `${acctCount} account${acctCount === 1 ? '' : 's'} across ${allCards.length} cards`;
    $('atEye').textContent = totalHidden ? 'Show' : 'Hide';
    $('allTotal').setAttribute('aria-pressed', String(!totalHidden));

    ['d0', 'd1', 'd2', 'd3'].forEach((id) => { $(id).style.cssText = 'will-change: opacity; ' + v[id]; });
    const A = v.acard;
    $('dName').textContent = A.name;
    $('dSub').textContent = `${A.tier} · •••• ${A.last4}`;
    $('expTag').textContent = 'Exp ' + A.exp;
    $('freezeBtn').className = 'act hit ' + v.freezeCls;
    $('freezeBtn').setAttribute('aria-pressed', v.frozenStr);
    $('freezeLbl').textContent = v.freezeLabel;
    $('revealBtn').className = 'act hit ' + v.revealCls;
    $('revealBtn').setAttribute('aria-pressed', v.revealStr);
    $('revealLbl').textContent = v.revealLabel;

    const accts = acctsOf(A.id);
    const total = accts.reduce((sum, a) => sum + a.balance, 0);
    const last = accts.map(lastTx).filter(Boolean).sort((a, b) => b.at.localeCompare(a.at))[0];
    $('balVal').textContent = v.reveal ? num(total) : MASK;
    $('acctCount').textContent = !loaded ? (loadFailed ? "Couldn't load records" : 'Loading…')
      : accts.length ? `${accts.length} account${accts.length === 1 ? '' : 's'}` : 'No accounts yet';
    $('lastAct').textContent = last ? 'Last activity ' + day(last.at) : '';

    const key = [A.id, ver, v.reveal, loaded, loadFailed].join('|');
    if (key !== listKey) {
      listKey = key;
      $('acctList').innerHTML = !loaded
        ? `<div class="empty">${loadFailed ? "Couldn't load your records. Check the app is running, then reload." : 'Loading…'}</div>`
        : !accts.length
          ? `<div class="empty"><span>No accounts on this card yet.<br>Add one to start tracking its balance.</span><button class="btn pri hit" type="button" data-act="add" style="flex:none">Add account</button></div>`
          : accts.map((a) => {
            const t = lastTx(a);
            const sub = [a.number ? acctNo(a.number, v.reveal) : '', t ? 'Updated ' + day(t.at) : 'No activity yet'].filter(Boolean).join(' · ');
            return `
        <button class="tx acct hit" type="button" data-id="${esc(a.id)}" aria-label="${esc(a.name)} account">
          <span class="txIco">${esc(a.name.trim().charAt(0).toUpperCase() || '?')}</span>
          <span class="txMain"><span class="txT">${esc(a.name)}</span><span class="txS">${esc(sub)}</span></span>
          <span class="amt">${v.reveal ? money(a.balance) : CUR + MASK}</span>
        </button>`;
          }).join('');
    }

    if (sheet && !v.open) closeSheet();
    else if (sheet && sheet.view === 'acct' && v.reveal !== sheetReveal) renderSheet();
  }

  let queued = false;
  __schedule = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; V = comp.renderVals(); apply(V); });
  };

  // Fit the 390×844 phone screen to any window
  const fit = $('fit');
  function resize() {
    const s = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1.25);
    fit.style.width = (390 * s) + 'px';
    fit.style.height = (844 * s) + 'px';
    app.style.transform = `scale(${s})`;
  }
  // transform on .app is set by resize; keep it out of the per-frame cssText writes
  window.addEventListener('resize', resize);
  resize();

  apply(V);
  if (comp.componentDidMount) comp.componentDidMount();
})();
</script>
</body>
</html>
