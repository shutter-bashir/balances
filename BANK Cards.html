spacing:-.02em;margin:0}\n\n  .grid{display:grid;grid-template-columns:minmax(0,min(100%,280px,36vh));justify-content:center;gap:28px}\n\n  /* ---------- Folder icon (everything sized in container units so both stay identical) ---------- */\n  .folder{position:relative;container-type:inline-size}\n  .tile{\n    position:relative;display:block;width:100%;aspect-ratio:1/1;padding:0;margin:0;border:0;background:none;\n    cursor:pointer;text-align:left;color:#fff;font:inherit;-webkit-tap-highlight-color:transparent;\n    border-radius:9cqw;\n  }\n  .tile:focus-visible{outline:3px solid var(--orange);outline-offset:4px}\n\n  .glow{\n    position:absolute;left:22cqw;right:22cqw;bottom:-7cqw;height:16cqw;border-radius:50%;\n    background:radial-gradient(closest-side, rgba(255,255,255,.35), rgba(255,255,255,0));\n    filter:blur(4cqw);opacity:.8;pointer-events:none;\n    transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1);\n  }\n  .back{\n    position:absolute;left:0;right:0;top:6cqw;bottom:0;border-radius:8cqw;\n    background:linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 100%);\n    -webkit-backdrop-filter:blur(1.5px) saturate(150%);backdrop-filter:blur(1.5px) saturate(150%);\n    border:1px solid rgba(255,255,255,.28);\n    box-shadow:0 2cqw 8cqw rgba(0,0,0,.35), inset 0 .6cqw 0 rgba(255,255,255,.35);\n  }\n\n  /* contents that peek out */\n  .contents{\n    position:absolute;left:22cqw;top:13cqw;width:58cqw;height:40cqw;\n    transition:transform .55s cubic-bezier(.34,1.45,.64,1);\n  }\n  .sheet{\n    position:absolute;width:36cqw;height:36cqw;border-radius:2.6cqw;background:#fff;\n    box-shadow:0 1cqw 3cqw rgba(120,40,10,.22);\n    padding:5cqw 4.5cqw;display:flex;flex-direction:column;gap:2.4cqw;\n  }\n  .sheet i{display:block;height:1.6cqw;border-radius:1cqw;background:#e4e1df}\n  .sheet i:nth-child(1){width:75%}\n  .sheet i:nth-child(2){width:55%}\n  .sheet i:nth-child(3){width:68%}\n  .s1{left:0;top:1cqw;transform:rotate(- active svg{transform:rotate(60deg)}\n  .gear svg{transition:transform .4s ease}\n  .gear:focus-visible{outline:2px solid #fff;outline-offset:-2px}\n\n  /* open interaction: hover / focus / tap */\n  .tile:hover .contents,.tile:focus-visible .contents,.folder.open .contents{transform:translateY(-9cqw)}\n  .tile:hover .front,.tile:focus-visible .front,.folder.open .front{transform:translateY(2cqw)}\n  .tile:hover ~ .gear,.folder.open .gear{transform:translateY(2cqw)}\n  .tile:hover .glow,.folder.open .glow{opacity:1;transform:scale(1.15)}\n  .tile:active .front{transform:translateY(2cqw) scale(.985)}\n\n  .caption{margin:18px 4px 0;font-size:15px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}\n\n  /* ---------- Liquid glass \"+\" button ---------- */\n  .liquid{\n    position:relative;width:48px;height:48px;border-radius:50%;border:0;padding:0;cursor:pointer;color:#fff;\n    display:grid;place-items:center;-webkit-tap-highlight-color:transparent;\n    background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.28),rgba(255,255,255,.06) 60%,rgba(255,255,255,.12));\n    -webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.1);backdrop-filter:blur(14px) saturate(190%) brightness(1.1);\n    box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -2px 6px rgba(255,255,255,.12),\n      inset 3px 0 6px -3px rgba(255,150,120,.5),inset -3px 0 6px -3px rgba(140,210,255,.5),0 10px 24px rgba(0,0,0,.45);\n    transition:transform .45s cubic-bezier(.34,1.56,.64,1);\n  }\n  .liquid::after{content:\"\";position:absolute;left:18%;right:18%;top:7%;height:38%;border-radius:50%;\n    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}\n  .liquid svg{width:22px;height:22px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}\n  .liquid:hover svg{transform:rotate(90deg)}\n  .liquid:active{transform:scale(.88,.92)}\n  .liquid:focus-visible{outline:2px so pan class=\"chip\"><\/span><span class=\"dots\"><\/span><\/span>\n          <span class=\"mini m2\"><span class=\"brand\"><\/span><span class=\"chip\"><\/span><span class=\"dots\"><\/span><\/span>\n        <\/span>\n        <span class=\"front\" aria-hidden=\"true\">\n          <span class=\"sheen\"><\/span>\n          <svg class=\"edge\" viewBox=\"0 0 100 74\" preserveAspectRatio=\"none\"><path d=\"M0 9.5Q0 2 7.5 2H33C37 2 39 3.6 41 6.4L44.6 11.6C46.4 14.2 48.4 15.4 52 15.4H92Q100 15.4 100 23.4\"/><\/svg>\n          <span class=\"label\">\n            <span class=\"name\">Cards<\/span>\n            <span class=\"sub\">Debit &amp; Credit<\/span>\n          <\/span>\n        <\/span>\n      <\/button>\n      <button class=\"gear\" type=\"button\" aria-label=\"Cards settings\">\n        <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1zM12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6z\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/section>\n\n  <div class=\"caption\">\n    <span id=\"count\">2 folders<\/span>\n    <button class=\"liquid\" type=\"button\" id=\"addBtn\" aria-label=\"Add folder\" aria-haspopup=\"dialog\">\n      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/svg>\n    <\/button>\n  <\/div>\n<\/main>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<form class=\"sheet-panel\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\" aria-hidden=\"true\" autocomplete=\"off\">\n  <div class=\"grabber\"><\/div>\n  <div class=\"sheet-head\">\n    <button class=\"txtbtn\" type=\"button\" id=\"cancelBtn\">Cancel<\/button>\n    <h2 id=\"sheetTitle\">New Folder<\/h2>\n    <button class=\"txtbtn strong\" type=\"submit\" id=\"saveBtn\" disabled>Add<\/button>\n  <\/div>\n  <label class=\"field\"><span>Name<\/span><input id=\"fName\" maxlength=\"14\" placeholder=\"e.g. Travel\" required><\/label>\n  <label class=\"field\"><span>Subtitle<\/span><input id=\"fSub\" maxlength=\"24\" placeholder=\"e.g. Trips &amp; Tickets\"><\/label>\n  <div class=\"seg-label\" id=\"segLbl\">Inside<\/div>\n  <div class=\"seg\" role=\"group\" aria-labelledby=\"segLbl\">\n    <button type=\"button\" data-kind=\"papers\" aria-pressed=\"true\">Papers<\/button>\n    <button type=\"button\" data-kind=\"cards\" aria-pressed=\"false\">Cards<\/button>\n    <button type=\"button\" data-kind=\"empty\" aria-pressed=\"false\">Empty<\/button>\n  <\/div>\n<\/form>\n\n<script>\n  var grid = document.querySelector('.grid');\n\n  // Tap a folder to open/close it (touch screens have no hover). Delegated so new folders work too.\n  grid.addEventListener('click', function (e) {\n    var tile = e.target.closest('.tile');\n    if (!tile) return;\n    var f = tile.parentElement;\n    // Folders that lead somewhere play their open animation, then navigate the whole app.\n    if (tile.dataset.href) return leaveTo(f, tile);\n    var wasOpen = f.classList.contains('open');\n    grid.querySelectorAll('.folder.open').forEach(function (o) { o.classList.remove('open'); });\n    if (!wasOpen) f.classList.add('open');\n  });\n\n  var leaving = false;\n  function leaveTo(f, tile) {\n    if (leaving) return;\n    leaving = true;\n    var go = function () { window.__nav(tile.dataset.href); };\n    f.classList.add('open', 'going');\n    document.body.classList.add('leaving');\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return go();\n    // After the press, a veil in the next page's colour grows out of the folder to fill the screen.\n    setTimeout(function () {\n      var r = tile.getBoundingClientRect();\n      var veil = document.createElement('div');\n      veil.className = 'veil';\n      veil.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;' +\n        'border-radius:' + getComputedStyle(tile).borderRadius + ';background:' + tile.dataset.veil;\n      document.body.appendChild(veil);\n      veil.getBoundingClientRect();\n      veil.style.cssText += ';left:0;top:0;width:100vw;height:100vh;border-radius:0;opacity:1';\n      setTimeout(go, 520);\n    }, 280);\n  }\n  // Coming back with the browser's Back button can restore this page mid-animation; reset it.\n  window.addEventListener('pageshow', function (e) {\n    if (!e.persisted) return;\n    leaving = false;\n    document.body.classList.remove('leaving');\n    document.querySelectorAll('.veil').forEach(function (v) { v.remove(); });\n    grid.querySelectorAll('.folder.going').forEach(function (o) { o.classList.remove('going', 'open'); });\n  });\n\n  // Templates taken from the two existing folders\n  var folders = grid.querySelectorAll('.folder');\n  var template = folders[1].cloneNode(true);\n  delete template.querySelector('.tile').dataset.href;\n  var CONTENTS = {\n    papers: '<span class=\"sheet s1\"><i><\/i><i><\/i><i><\/i><\/span><span class=\"sheet s2\"><i><\/i><i><\/i><i><\/i><\/span><span class=\"sheet s3\"><i><\/i><i><\/i><i><\/i><\/span>',\n    cards: folders[1].querySelector('.contents').innerHTML,\n    empty: ''\n  };\n\n  var addBtn = document.getElementById('addBtn');\n  var sheet = document.getElementById('sheet');\n  var scrim = document.getElementById('scrim');\n  var nameIn = document.getElementById('fName');\n  var subIn = document.getElementById('fSub');\n  var saveBtn = document.getElementById('saveBtn');\n  var segBtns = sheet.querySelectorAll('.seg button');\n  var kind = 'papers';\n\n  function openSheet() {\n    nameIn.value = ''; subIn.value = ''; saveBtn.disabled = true; setKind('papers');\n    sheet.classList.add('show'); scrim.classList.add('show'); sheet.setAttribute('aria-hidden', 'false');\n    setTimeout(function () { nameIn.focus(); }, 350);\n  }\n  function closeSheet() {\n    sheet.classList.remove('show'); scrim.classList.remove('show'); sheet.setAttribute('aria-hidden', 'true');\n    addBtn.focus();\n  }\n  function setKind(k) {\n    kind = k;\n    segBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.kind === k)); });\n  }\n\n  addBtn.addEventListener('click', function () {\n    addBtn.classList.remove('wobble'); void addBtn.offsetWidth; addBtn.classList.add('wobble');\n    openSheet();\n  });\n  document.getElementById('cancelBtn').addEventListener('click', closeSheet);\n  scrim.addEventListener('click', closeSheet);\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet(); });\n  segBtns.forEach(function (b) { b.addEventListener('click', function () { setKind(b.dataset.kind); }); });\n  nameIn.addEventListener('input', function () { saveBtn.disabled = !nameIn.value.trim(); });\n\n  sheet.addEventListener('submit', function (e) {\n    e.preventDefault();\n    var name = nameIn.value.trim();\n    if (!name) return;\n    var sub = subIn.value.trim() || 'New folder';\n    var f = template.cloneNode(true);\n    f.classList.remove('open');\n    f.querySelector('.name').textContent = name;\n    f.querySelector('.sub').textContent = sub;\n    f.querySelector('.contents').innerHTML = CONTENTS[kind];\n    f.querySelector('.tile').setAttribute('aria-label', 'Open ' + name + ', ' + sub);\n    f.querySelector('.gear').setAttribute('aria-label', name + ' settings');\n    f.classList.add('pop');\n    grid.appendChild(f);\n    var n = grid.querySelectorAll('.folder').length;\n    document.getElementById('count').textContent = n + ' folders';\n    closeSheet();\n    setTimeout(function () { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 250);\n  });\n<\/script>\n<\/body>\n<\/html>\n" },
  "/savings": { title: "Savings", html: "<!doctype html>\n<html lang=\"en\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Savings Jars<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style>\n/* Layout: a dark gallery of stacked \"glass over colour\" savings widgets, a dashed + tile at the end, and a sheet that opens on tap. */\n:root{\n  --bg:#030805; --fg:#eff6f0; --muted:#86978a; --line:rgba(255,255,255,.09);\n  --surface:#0f1611; --surface-2:#18211a; --accent:#43b549; --accent-ink:#03200a;\n  --danger:#ff6f61; --ok:#5fd16b;\n  --face-top:#1f2b22; --face-bot:#070d09; --ink:#06240f; --glow:#43b549;\n  --font-ui:\"Onest\",ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n  --r-widget:38px; --r-sheet:28px;\n  color-scheme:dark;\n}\n@media (prefers-color-scheme: light){ :root:not([data-theme=\"dark\"]){\n  --bg:#edf3ee; --fg:#0e1a11; --muted:#57685b; --line:rgba(0,0,0,.09);\n  --surface:#ffffff; --surface-2:#f0f5f1; --accent:#1e9a3a; --accent-ink:#ffffff;\n  --danger:#d23b2e; --ok:#1a8a35; --glow:#2aa845; color-scheme:light;\n}}\n:root[data-theme=\"light\"]{\n  --bg:#edf3ee; --fg:#0e1a11; --muted:#57685b; --line:rgba(0,0,0,.09);\n  --surface:#ffffff; --surface-2:#f0f5f1; --accent:#1e9a3a; --accent-ink:#ffffff;\n  --danger:#d23b2e; --ok:#1a8a35; --glow:#2aa845; color-scheme:light;\n}\n*{box-sizing:border-box}\nhtml,body{min-height:100%}\nbody{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 6 ript>\n(() => {\nconst THEMES = {\n  green: {c1:\"#2fa84a\", c2:\"#7fd85c\", name:\"Green\"},\n  deep:  {c1:\"#0d7a3c\", c2:\"#45b84d\", name:\"Deep green\"},\n  lime:  {c1:\"#8fd34a\", c2:\"#d4f26c\", name:\"Lime\"},\n  mint:  {c1:\"#1fbf8f\", c2:\"#8ef0c4\", name:\"Mint\"},\n  teal:  {c1:\"#12a197\", c2:\"#62e0cf\", name:\"Teal\"},\n  red:   {c1:\"#e2382f\", c2:\"#ff8a6a\", name:\"Red\"},\n};\nconst DEF = THEMES.green;\nconst HIST_CAP = 300;\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s ?? \"\").replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);\n\nlet mode = \"loading\";          // \"db\" | \"local\"\nlet goals = [];\nlet settings = { currency: \"KSh\" };\nlet openSheet = null;          // {kind:'detail'|'edit'|'new', id?}\nlet store = null;\n\n/* ---------- formatting ---------- */\nconst nf0 = new Intl.NumberFormat(undefined,{maximumFractionDigits:2});\nconst money = (n, withCur = true) => (withCur ? settings.currency + \" \" : \"\") + nf0.format(Math.round(n*100)/100);\nconst balanceOf = g => (g.history||[]).reduce((s,h)=> s + (h.type===\"out\" ? -h.amt : h.amt), 0);\nfunction ago(t){\n  const d = (Date.now()-t)/1000;\n  if (d < 60) return \"just now\";\n  if (d < 3600) return Math.floor(d/60)+\"m ago\";\n  if (d < 86400) return Math.floor(d/3600)+\"h ago\";\n  if (d < 86400*7) return Math.floor(d/86400)+\"d ago\";\n  return new Date(t).toLocaleDateString(undefined,{day:\"numeric\",month:\"short\",year:\"numeric\"});\n}\nfunction monthNet(g){\n  const now = new Date(), m = now.getMonth(), y = now.getFullYear();\n  return (g.history||[]).reduce((s,h)=>{ const d=new Date(h.t); return (d.getMonth()===m&&d.getFullYear()===y) ? s+(h.type===\"out\"?-h.amt:h.amt) : s; },0);\n}\n\n/* ---------- sparkline ---------- */\nfunction series(g){\n  let run = 0; const pts = [0];\n  (g.history||[]) fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg>`;\nconst EDIT = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h4L19 9l-4-4L4 16v4z\"/><\/svg>`;\n\nfunction renderTop(){\n  const total = goals.reduce((s,g)=>s+balanceOf(g),0);\n  const month = goals.reduce((s,g)=>s+monthNet(g),0);\n  $(\"#total\").textContent = mode===\"loading\" ? \"—\" : money(total);\n  $(\"#totalSub\").textContent = mode===\"loading\" ? \"Loading your goals…\"\n    : goals.length ? `${goals.length} saving${goals.length>1?\"s\":\"\"} · ${month>=0?\"+\":\"−\"}${money(Math.abs(month))} this month`\n    : \"No savings yet\";\n  $(\"#currency\").value = settings.currency;\n}\nfunction widgetHTML(g, i, hi){\n    const th = THEMES[g.theme]||DEF, net = monthNet(g);\n    const label = g.history?.length\n      ? `<b>${net>=0?\"+\":\"−\"}${money(Math.abs(net))}<\/b> this month`\n      : \"Tap to add your first deposit\";\n    return `<button class=\"widget${hi?\" hi\":\"\"}\" data-id=\"${esc(g.id)}\" style=\"--c1:${th.c1};--c2:${th.c2}\" aria-label=\"${esc(g.name)}: ${esc(money(balanceOf(g)))} saved${hi?\", highlighted\":\"\"}\">\n      <div class=\"base\"><\/div>\n      <div class=\"face\">\n        ${hi?`<span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.8 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z\"/><\/svg>Top<\/span>`:\"\"}\n        <div class=\"amt\">${esc(g.name)}<\/div>\n        <div class=\"spark\">${sparkSVG(g,i)}<\/div>\n        <div class=\"face-label\">${label}<\/div>\n      <\/div>\n      <div class=\"foot\"><span class=\"bal\"><small>${esc(settings.currency)}<\/small>${nf0.format(balanceOf(g))}<\/span><span class=\"pill\">Savings<\/span><\/div>\n    <\/button>`;\n}\nfunction renderGrid(){\n  const grid = $(\"#grid\"), feat = $(\"#featured\");\n  const top = goals.slice(0,2), rest = goals.slice(2);\n  feat.innerHTML = top.map((g,i)=>widgetHTML(g,i,true)).join(\"\");\n  $(\"#featWrap\").hidden = !top.length;\n  $(\"#moreHead\").textContent = top.length ? \"More savings\" : \"My savings\";\n  let html = rest.map((g,i)=>widgetHTML(g,i+2,false)).join(\"\");\n  if (mode !== \"loading\" && !goals.length) html += `<p class=\"empty\">Each saving gets its own widget here. Tap the + tile to create one, then tap the widget to add or deduct money. Your first two widgets are highlighted at the top.<\/p>`;\n  html += `<button class=\"add-tile\" id=\"addTile\"><div class=\"ring\">${PLUS}<\/div><span>Add savings widget<\/span><\/button>`;\n  grid.innerHTML = html;\n  $(\"#addTile\").onclick = () => openNew();\n  document.querySelectorAll(\".widget\").forEach(el => el.onclick = e => pressWidget(el, e, () => openDetail(el.dataset.id)));\n}\nfunction pressWidget(el, e, done){\n  const face = el.querySelector(\".face\"), r = face.getBoundingClientRect();\n  const fromKeyboard = e.detail === 0;\n  const rip = document.createElement(\"span\"), size = Math.max(r.width, r.height) * 2.2;\n  rip.className = \"ripple\";\n  rip.style.cssText = `left:${fromKeyboard ? r.width/2 : e.clientX - r.left}px;top:${fromKeyboard ? r.height/2 : e.clientY - r.top}px;width:${size}px;height:${size}px`;\n  face.appendChild(rip);\n  setTimeout(() => rip.remove(), 700);\n  el.classList.remove(\"pressed\"); void el.offsetWidth; el.classList.add(\"pressed\");\n  setTimeout(() => el.classList.remove(\"pressed\"), 450);\n  setTimeout(done, 180);\n}\nfunction renderAll(){ renderTop(); renderGrid(); if (openSheet) renderSheet(); }\n\n/* ---------- sheets ---------- */\nlet draft = {};      // form state for new/edit\nlet txErr = \"\", confirmDelete = false;\nfunction openNew(){ draft = {name:\"\", start:\"\", theme: Object.keys(THEMES)[goals.length % 6]}; openSheet = {kind:\"new\"}; renderSheet(true); }\nfunction openEdit(id){ const g=find(id); draft={name:g.name,theme:g.theme}; openSheet={kind:\"edit\",id}; confirmDelete=false; renderSheet(true); }\nfunction openDetail(id){ openSheet={kind:\"detail\",id}; txErr=\"\"; confirmDelete=false; renderSheet(true); }\nfunction closeSheet(){ openSheet=null; $(\"#layer\").innerHTML=\"\"; }\nconst find = id => goals.find(g=>g.id===id);\n\nfunction renderSheet(focus){\n  const layer = $(\"#layer\");\n  if (!openSheet){ layer.innerHTML=\"\"; return; }\n  const k = openSheet.kind;\n  let body = \"\";\n  if (k === \"detail\"){\n    const g = find(openSheet.id); if (!g){ closeSheet(); return; }\n    const th = THEMES[g.theme]||DEF, bal = balanceOf(g), net = monthNet(g);\n    const prevAmt = $(\"#txAmt\")?.value || \"\", prevNote = $(\"#txNote\")?.value || \"\";\n    const hist = (g.history||[]).slice().sort((a,b)=>b.t-a.t);\n    body = `<div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(g.name)}\" style=\"--c1:${th.c1};--c2:${th.c2}\">\n      <div class=\"sheet-head\">\n        <div class=\"sheet-title\">${esc(g.name)}<\/div>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"icon-btn\" id=\"editBtn\" aria-label=\"Edit savings\">${EDIT}<\/button>\n          <button class=\"icon-btn\" id=\"closeBtn\" aria-label=\"Close\">${CLOSE}<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"hero\">\n        <div class=\"lbl\">Balance<\/div>\n        <div class=\"big\" id=\"bigBal\">${esc(money(bal))}<\/div>\n        <div class=\"bar-meta\"><span>${net>=0?\"+\":\"−\"}${esc(money(Math.abs(net)))} this month<\/span><span>${(g.history||[]).length} transaction${(g.history||[]).length===1?\"\":\"s\"}<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"txAmt\">Amount<\/label>\n        <div class=\"money-in\" style=\"--curw:${settings.currency.length}ch\"><span class=\"cur\">${esc(settings.currency)}<\/span>\n          <input class=\"input\" id=\"txAmt\" inputmode=\"decimal\" placeholder=\"0\" value=\"${esc(prevAmt)}\" autocomplete=\"off\"><\/div>\n        <div class=\"chips\">${[100,500,1000,5000].map(v=>`<button class=\"chip\" data-q=\"${v}\">+${nf0.format(v)}<\/button>`).join(\"\")}<\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"txNote\">Note (optional)<\/label>\n        <input class=\"input\" id=\"txNote\" maxlength=\"60\" placeholder=\"e.g. Salary, M-Pesa, groceries\" value=\"${esc(prevNote)}\" autocomplete=\"off\">\n      <\/div>\n      <div class=\"err\" id=\"txErr\" role=\"alert\">${esc(txErr)}<\/div>\n      <div class=\"row2\">\n        <button class=\"btn btn-add\" id=\"doAdd\">${PLUS} Add<\/button>\n        <button class=\"btn btn-ded\" id=\"doDed\">${MINUS} Deduct<\/button>\n      <\/div>\n      <div class=\"sec\">History<\/div>\n      ${hist.length ? `<ul class=\"hist\">${hist.map(h=>`<li class=\"${h.type===\"out\"?\"out\":\"in\"}\">\n          <span class=\"dot\">${h.type===\"out\"?\"−\":\"+\"}<\/span>\n          <span class=\"note\">${esc(h.note || (h.type===\"out\"?\"Deducted\":\"Added\"))}<span class=\"when\">${esc(ago(h.t))}<\/span><\/span>\n          <span class=\"v\">${h.type===\"out\"?\"−\":\"+\"}${esc(money(h.amt))}<\/span><\/li>`).join(\"\")}<\/ul>`\n        : `<div class=\"hist-empty\">No transactions yet. Add an amount above.<\/div>`}\n    <\/div>`;\n  } else {\n    const isNew = k === \"new\";\n    body = `<div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${isNew?\"New savings widget\":\"Edit savings\"}\">\n      <div class=\"sheet-head\"><div class=\"sheet-title\">${isNew?\"New savings widget\":\"Edit savings\"}<\/div>\n        <button class=\"icon-btn\" id=\"closeBtn\" aria-label=\"Close\">${CLOSE}<\/button><\/div>\n      <div class=\"field\"><label for=\"fName\">Name<\/label><input class=\"input\" id=\"fName\" maxlength=\"28\" placeholder=\"e.g. School fees\" value=\"${esc(draft.name)}\"><\/div>\n      ${isNew?`<div class=\"field\"><label for=\"fStart\">Starting balance (optional)<\/label>\n        <div class=\"money-in\" style=\"--curw:${settings.currency.length}ch\"><span class=\"cur\">${esc(settings.currency)}<\/span><input class=\"input\" id=\"fStart\" inputmode=\"decimal\" placeholder=\"0\" value=\"${esc(draft.start)}\"><\/div><\/div>`:\"\"}\n      <div class=\"field\"><label>Colour<\/label><div class=\"swatches\">${Object.entries(THEMES).map(([key,t])=>\n        `<button class=\"sw\" data-t=\"${key}\" aria-label=\"${t.name}\" aria-pressed=\"${draft.theme===key}\" style=\"--c1:${t.c1};--c2:${t.c2}\"><\/button>`).join(\"\")}<\/div><\/div>\n      <div class=\"err\" id=\"fErr\" role=\"alert\"><\/div>\n      <div class=\"row2\"><button class=\"btn btn-ghost\" id=\"cancelBtn\">Cancel<\/button><button class=\"btn btn-add\" id=\"saveBtn\">${isNew?\"Create widget\":\"Save changes\"}<\/button><\/div>\n      ${!isNew?`<div class=\"foot-actions\"><button class=\"link danger\" id=\"delBtn\">Delete this saving<\/button><\/div>\n        ${confirmDelete?`<div class=\"confirm\">Delete “${esc(draft.name)}” and all its history? This can't be undone.\n          <div class=\"row2\"><button class=\"btn btn-ghost\" id=\"delNo\">Keep it<\/button><button class=\"btn btn-danger\" id=\"delYes\">Delete<\/button><\/div><\/div>`:\"\"}`:\"\"}\n    <\/div>`;\n  }\n  layer.innerHTML = `<div class=\"scrim\" id=\"scrim\">${body}<\/div>`;\n  $(\"#scrim\").addEventListener(\"click\", e => { if (e.target.id===\"scrim\") closeSheet(); });\n  $(\"#closeBtn\").onclick = closeSheet;\n  if (k === \"detail\") wireDetail(focus); else wireForm(focus);\n}\n\nfunction parseAmt(v){ const n = parseFloat(String(v).replace(/[^\\d.]/g,\"\")); return isFinite(n) ? Math.round(n*100)/100 : NaN; }\n\nfunction wireDetail(focus){\n  const g = find(openSheet.id), amt = $(\"#txAmt\");\n  if (focus) setTimeout(()=>amt.focus({preventScroll:true}), 60);\n  $(\"#editBtn\").onclick = () => openEdit(g.id);\n  document.querySelectorAll(\".chip\").forEach(c => c.onclick = () => {\n    const cur = parseAmt(amt.value) || 0; amt.value = String(cur + +c.dataset.q); amt.focus();\n  });\n  const go = async type => {\n    const n = parseAmt(amt.value);\n    txErr = \"\";\n    if (!(n > 0)) txErr = \"Enter an amount greater than 0.\";\n    else if (type===\"out\" && n > balanceOf(g)) txErr = `You only have ${money(balanceOf(g))} in this saving.`;\n    if (txErr){ $(\"#txErr\").textContent = txErr; amt.focus(); return; }\n    const note = $(\"#txNote\").value.trim();\n    const history = [...(g.history||[]), {id:uid(), type, amt:n, note, t:Date.now()}].slice(-HIST_CAP);\n    amt.value = \"\"; $(\"#txNote\").value = \"\";\n    try { await store.save({...g, history}); toast(type===\"in\" ? `Added ${money(n)}` : `Deducted ${money(n)}`); }\n    catch(e){ txErr = \"Couldn't save that change. Check your connection and try again.\"; renderSheet(); }\n  };\n  $(\"#doAdd\").onclick = () => go(\"in\");\n  $(\"#doDed\").onclick = () => go(\"out\");\n  amt.addEventListener(\"keydown\", e => { if (e.key===\"Enter\") go(\"in\"); });\n}\n\nfunction wireForm(focus){\n  const isNew = openSheet.kind === \"new\";\n  const sync = () => { draft.name=$(\"#fName\").value; if(isNew) draft.start=$(\"#fStart\").value; };\n  if (focus) setTimeout(()=>$(\"#fName\").focus({preventScroll:true}), 60);\n  document.querySelectorAll(\".sw\").forEach(b => b.onclick = () => { sync(); draft.theme=b.dataset.t; renderSheet(); });\n  $(\"#cancelBtn\").onclick = () => isNew ? closeSheet() : openDetail(openSheet.id);\n  $(\"#saveBtn\").onclick = async () => {\n    sync();\n    const name = draft.name.trim(), start = isNew ? parseAmt(draft.start||\"0\") : 0;\n    const err = !name ? \"Give this goal a name.\" : (isNew && isNaN(start)) ? \"Starting balance must be a number.\" : \"\";\n    if (err){ $(\"#fErr\").textContent = err; return; }\n    try{\n      if (isNew){\n        const g = {id:uid(), name, theme:draft.theme, createdAt:Date.now(),\n          history: start>0 ? [{id:uid(), type:\"in\", amt:start, note:\"Starting balance\", t:Date.now()}] : []};\n        await store.save(g); closeSheet(); toast(`Created ${name}`);\n      } else {\n        const g = find(openSheet.id); const {target:_t, ...keep} = g; await store.save({...keep, name, theme:draft.theme}); openDetail(g.id);\n      }\n    }catch(e){ $(\"#fErr\").textContent = \"Couldn't save. Check your connection and try again.\"; }\n  };\n  if (!isNew){\n    $(\"#delBtn\").onclick = () => { sync(); confirmDelete = true; renderSheet(); };\n    if (confirmDelete){\n      $(\"#delNo\").onclick = () => { confirmDelete=false; renderSheet(); };\n      $(\"#delYes\").onclick = async () => { const id=openSheet.id, nm=find(id)?.name; try{ await store.remove(id); closeSheet(); toast(`Deleted ${nm}`);}catch(e){ $(\"#fErr\").textContent=\"Couldn't delete. Try again.\"; } };\n    }\n  }\n}\n\ndocument.addEventListener(\"keydown\", e => { if (e.key===\"Escape\" && openSheet) closeSheet(); });\nlet toastT;\nfunction toast(msg){\n  document.querySelector(\".toast\")?.remove();\n  const t = document.createElement(\"div\"); t.className=\"toast\"; t.setAttribute(\"role\",\"status\"); t.textContent=msg;\n  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 1800);\n}\n\n$(\"#addTop\").onclick = openNew;\n$(\"#currency\").onchange = async e => { settings = {...settings, currency:e.target.value}; renderAll(); try{ await store?.saveSettings(settings); }catch{} };\n\n/* ---------- storage ---------- */\nfunction clean(g){ const {id, ...rest} = g; return JSON.parse(JSON.stringify(rest)); }\n\nfunction dbStore(db, userId){\n  const col = db.collection(\"data/users/\" + userId);\n  col.onSnapshot(snap => {\n    const list = [];\n    snap.docs.forEach(d => {\n      const v = d.data(); if (!v) return;\n      if (d.id === \"settings\") settings = {currency:\"KSh\", ...v};\n      else list.push({id:d.id, ...v});\n    });\n    goals = list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));\n    mode = \"db\"; renderAll();\n  }, err => { showBanner(\"Lost <span>Top up<\/span>\n      <\/button>\n      <button class=\"act hit\" type=\"button\" id=\"deductBtn\">\n        <span class=\"glass round\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V4M7 9l5-5 5 5M5 20h14\"><\/path><\/svg><\/span>\n        <span>Deduct<\/span>\n      <\/button>\n      <button class=\"act hit\" type=\"button\" id=\"freezeBtn\">\n        <span class=\"glass round\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5\"><\/path><\/svg><\/span>\n        <span id=\"freezeLbl\"><\/span>\n      <\/button>\n      <button class=\"act hit\" type=\"button\" id=\"revealBtn\">\n        <span class=\"glass round\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z\"><\/path><circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle><\/svg><\/span>\n        <span id=\"revealLbl\"><\/span>\n      <\/button>\n    <\/div>\n\n    <div class=\"glass panel feed\" id=\"d3\">\n      <div class=\"feedHead\">\n        <span class=\"feedTitle\">Accounts<\/span>\n        <button class=\"glass round hit addMini\" type=\"button\" id=\"addAcctBtn2\" aria-label=\"Add account to this card\">\n          <svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n        <\/button>\n      <\/div>\n      <div class=\"acctList\" id=\"acctList\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sheetWrap\" id=\"sheetWrap\" aria-hidden=\"true\">\n    <div class=\"glass sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\" tabindex=\"-1\"><\/div>\n  <\/div>\n  <div class=\"glass toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<\/div>\n<\/div>\n\n<script>\n// Minimal stand-in for the design runtime: state + batched re-render.\nlet __schedule = () => {};\nclass DCLogic {\n  constructor(props) { this.props = props || {}; this.state = {}; }\n  setState(p) {\n    const patch = typeof p === 'function' ? p(this.state, this.props) : p;\n    if (!patch) return;\n    this.state = Object.assign({}, this.state, patch);\n    __schedule();\n  }\n  forceUpdate() { __schedule(); }\n}\n\nclass Component extends DCLogic {\n  constructor(...args) {\n    super(...args);\n    this.state = { lit: false, active: 3, open: false, dragging: false, dx: 0, dy: 0, frozen: {}, reveal: false };\n    this.drag = null;\n    this.moved = false;\n    this.timer = null;\n  }\n\n  componentDidMount() {\n    this.timer = setTimeout(() => this.setState({ lit: true }), 400);\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this.timer);\n  }\n\n  data() {\n    if (this._d) return this._d;\n    const cards = [\n      { id: 'coop-classic', art: 'coop-classic', name: 'CO-OPERATIVE BANK', tier: 'Visa Debit', last4: '3400', full: '4407 8300 4938 3400', exp: '05/21', g1: '#041a12', g2: '#0b5b39', g3: '#55b986' },\n      { id: 'sc-priority', art: 'sc-priority', name: 'STANDARD CHARTERED', tier: 'Visa Infinite', last4: '0000', full: '4231 7900 1234 0000', exp: '12/18', g1: '#041634', g2: '#0b3d7a', g3: '#3fa9e0' },\n      { id: 'credit', art: 'credit', name: 'CREDIT BANK', tier: 'Prepaid', last4: '8901', full: '4641 1234 5678 8901', exp: '12/22', g1: '#3d1704', g2: '#f46e16', g3: '#ffb12b' },\n      { id: 'family', art: 'family', name: 'FAMILY BANK', tier: 'Visa', last4: '4239', full: '4239', exp: '—', g1: '#5f4704', g2: '#d1a313', g3: '#f6df7e' },\n      { id: 'im-infinite', art: 'im-infinite', name: 'I&M BANK', tier: 'Visa Infinite', last4: '4054', full: '4054', exp: '—', g1: '#050505', g2: '#202124', g3: '#00a5b5' },\n      { id: 'ncba', art: 'ncba', name: 'NCBA BANK', tier: 'Visa Debit', last4: '4321', full: '4567 8909 8765 4321', exp: '06/30', g1: '#141416', g2: '#3a3a3e', g3: '#1fa8e0' },\n      { id: 'sbm-one', art: 'sbm-one', name: 'SBM BANK', tier: 'Visa Signature', last4: '7710', full: '4000 5500 0000 7710', exp: '—', g1: '#000000', g2: '#1c1c1c', g3: '#8a8a8a' }\n    ];\n    let seed = 20261004;\n    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };\n    const sparkles = [];\n    for (let i = 0; i < 44; i++) {\n      const star = rnd() < 0.45;\n      const size = star ? 10 + rnd() * 16 : 6;\n      sparkles.push({\n        kind: star ? 'star' : 'dot',\n        style: `left: ${(rnd() * 100).toFixed(1)}%; top: ${(rnd() * 100).toFixed(1)}%; width: ${size.toFixed(0)}px; height: ${size.toFixed(0)}px; animation-duration: ${(2.2 + rnd() * 3.4).toFixed(2)}s; animation-delay: ${(rnd() * 5).toFixed(2)}s`\n      });\n    }\n    this._d = { cards, sparkles };\n    return this._d;\n  }\n\n  stackT(d) {\n    const ad = Math.abs(d);\n    const a = Math.min(ad, 1);\n    const sg = d < 0 ? -1 : (d > 0 ? 1 : 0);\n    const far = Math.max(ad - 1, 0);\n    // Side cards turn so their OUTER edge recedes into the distance (cover-flow),\n    // and each step outward sits further back so inner cards always overlap outer ones.\n    return {\n      x: sg * (a * 118 + far * 26),\n      y: -38 * (1 - a),\n      z: -a * 140 - far * 80,\n      ry: sg * a * 62,\n      rz: 90,\n      sc: 1\n    };\n  }\n\n  onDown = (e) => {\n    if (e.button !== undefined && e.button !== 0) return;\n    const r = e.currentTarget.getBoundingClientRect();\n    this.drag = { x: e.clientX, y: e.clientY, axis: null, k: (r.width / 390) || 1 };\n    this.moved = false;\n  };\n\n  onMove = (e) => {\n    const g = this.drag;\n    if (!g) return;\n    const dx = (e.clientX - g.x) / g.k;\n    const dy = (e.clientY - g.y) / g.k;\n    if (!g.axis) {\n      if (Math.hypot(dx, dy) < 8) return;\n      g.axis = this.state.open ? 'y' : (Math.abs(dx) > Math.abs(dy) ? 'x' : 'y');\n      this.moved = true;\n    }\n    if (g.axis === 'x') {\n      this.setState({ dragging: true, dx: dx, dy: 0 });\n    } else {\n      const v = this.state.open ? Math.max(0, dy) : Math.min(0, dy);\n      this.setState({ dragging: true, dx: 0, dy: v });\n    }\n  };\n\n  onUp = () => {\n    const g = this.drag;\n    this.drag = null;\n    if (!g || !g.axis) return;\n    const s = this.state;\n    const n = this.data().cards.length;\n    const next = { dragging: false, dx: 0, dy: 0 };\n    if (g.axis === 'x') {\n      let step = Math.round(-s.dx / 120);\n      if (step === 0 && Math.abs(s.dx) > 36) step = s.dx < 0 ? 1 : -1;\n      next.active = Math.max(0, Math.min(n - 1, s.active + step));\n    } else {\n      if (!s.open && s.dy < -70) next.open = true;\n      if (s.open && s.dy > 70) { next.open = false; next.reveal = false; }\n    }\n    this.setState(next);\n    setTimeout(() => { this.moved = false; }, 0);\n  };\n\n\n  pick(i) {\n    if (this.moved) { this.moved = false; return; }\n    const s = this.state;\n    if (s.open) return;\n    if (i === s.active) this.setState({ open: true });\n    else this.setState({ active: i });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const D = this.data();\n    const accent = this.props.accent ?? '#ff4a2a';\n    const n = D.cards.length;\n    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n    const lerp = (a, b, t) => a + (b - a) * t;\n    const pos = clamp(s.active - s.dx / 120, -0.4, n - 0.6);\n    const p = s.open ? 1 - clamp(s.dy / 320, 0, 1) : clamp(-s.dy / 320, 0, 1);\n    const ease = 'cubic-bezier(.2,.85,.22,1)';\n    const tr = s.dragging ? 'none' : `transform .9s ${ease}, opacity .5s ease`;\n    const OPEN = { x: 0, y: -270, z: 0, ry: 0, rz: 0, sc: 1.1 };\n    const A = D.cards[s.active];\n    const shownIdx = Math.round(clamp(pos, 0, n - 1));\n    const L = D.cards[shownIdx];\n\n    const cards = D.cards.map((c, i) => {\n      const d = i - pos;\n      const st = this.stackT(d);\n      let t;\n      let op = 1;\n      if (i === s.active) {\n        t = {};\n        for (const k in st) t[k] = lerp(st[k], OPEN[k], p);\n      } else {\n        t = Object.assign({}, st, { y: st.y + 300 * p });\n        op = 1 - p;\n      }\n      const zi = i === s.active ? 200 : 100 - Math.round(Math.abs(d) * 10);\n      const isA = i === s.active;\n      return {\n        name: c.name,\n        tier: c.tier,\n        aria: `${c.name} card ending ${c.last4}` + (isA ? ', open' : ''),\n        num: (isA && s.reveal && s.open) ? c.full : `•••• •••• •••• ${c.last4}`,\n        art: c.art,\n        bg: c.art ? `url(\"${CARD_ART[c.art]}\") center / cover no-repeat` : `linear-gradient(128deg, ${c.g1} 0%, ${c.g2} 52%, ${c.g3} 100%)`,\n        flare: `radial-gradient(120% 90% at 100% 100%, ${c.g3}88 0%, ${c.g3}00 60%), radial-gradient(80% 60% at 0% 0%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 60%)`,\n        style: `transform: translate3d(${t.x.toFixed(2)}px, ${t.y.toFixed(2)}px, ${t.z.toFixed(2)}px) rotateY(${t.ry.toFixed(2)}deg) rotateZ(${t.rz.toFixed(2)}deg) scale(${t.sc.toFixed(3)}); opacity: ${op.toFixed(3)}; z-index: ${zi}; transition: ${tr}`,\n        dim: (Math.min(Math.abs(d), 3) * 0.14 * (1 - (isA ? p : 0))).toFixed(3),\n        frozen: !!s.frozen[c.id],\n        sweepDelay: 250 + Math.abs(i - 3) * 160,\n        shadeDelay: 200 + Math.abs(i - 3) * 160,\n        pick: () => this.pick(i)\n      };\n    });\n\n    const panel = (delay) => {\n      const dl = s.open ? delay : 0;\n      const trn = s.dragging ? 'none' : `opacity .55s ease ${dl}ms, transform .8s ${ease} ${dl}ms`;\n      return `opacity: ${p.toFixed(3)}; transform: translateY(${((1 - p) * 34).toFixed(1)}px) scale(${(0.97 + 0.03 * p).toFixed(3)}); transition: ${trn}`;\n    };\n\n    const homeTr = s.dragging ? 'none' : 'opacity .45s ease, transform .6s ease';\n    const frozen = !!s.frozen[A.id];\n\n    return {\n      litCls: s.lit ? 'lit' : '',\n      openCls: s.open ? 'is-open' : '',\n      p: p.toFixed(3),\n      cards,\n      sparkles: D.sparkles,\n      ambientBg: `radial-gradient(60% 38% at 50% 56%, ${accent}55 0%, ${accent}00 70%), radial-gradient(90% 28% at 50% 100%, ${accent}40 0%, ${accent}00 70%), radial-gradient(45% 25% at 88% 38%, ${accent}26 0%, ${accent}00 70%), radial-gradient(45% 25% at 10% 70%, ${accent}22 0%, ${accent}00 70%)`,\n      detailBg: `radial-gradient(70% 40% at 50% 22%, ${A.g3}70 0%, ${A.g3}00 70%), radial-gradient(70% 40% at 15% 72%, ${A.g2}cc 0%, ${A.g2}00 70%), radial-gradient(60% 35% at 90% 92%, ${A.g3}55 0%, ${A.g3}00 70%)`,\n      homeStyle: `opacity: ${(1 - p).toFixed(3)}; transform: translateY(${(-p * 18).toFixed(1)}px); transition: ${homeTr}`,\n      labName: L.name,\n      labId: L.id,\n      labSub: `${shownIdx + 1} of ${n} · ${L.tier} •••• ${L.last4}`,\n      acard: A,\n      open: s.open,\n      reveal: s.reveal,\n      d0: panel(120),\n      d1: panel(220),\n      d2: panel(300),\n      d3: panel(380),\n      freezeCls: frozen ? 'on' : '',\n      freezeLabel: frozen ? 'Unfreeze' : 'Freeze',\n      frozenStr: frozen ? 'true' : 'false',\n      revealCls: s.reveal ? 'on' : '',\n      revealLabel: s.reveal ? 'Hide' : 'Details',\n      revealStr: s.reveal ? 'true' : 'false',\n      onDown: this.onDown,\n      onMove: this.onMove,\n      onUp: this.onUp,\n      openIt: () => { if (!this.moved) this.setState({ open: true }); },\n      close: () => this.setState({ open: false, reveal: false }),\n      toggleFreeze: () => this.setState((prev) => ({ frozen: Object.assign({}, prev.frozen, { [A.id]: !prev.frozen[A.id] }) })),\n      toggleReveal: () => this.setState((prev) => ({ reveal: !prev.reveal })),\n      replay: () => {\n        if (this.moved || s.open) return;\n        clearTimeout(this.timer);\n        this.setState({ lit: false });\n        this.timer = setTimeout(() => this.setState({ lit: true }), 140);\n      }\n    };\n  }\n}\n\n\n(function () {\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s).replace(/[&<>\"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const comp = new Component({ accent: '#ff4a2a' });\n  let V = comp.renderVals();\n\n  // Sparkles (static)\n  $('sparkles').innerHTML = V.sparkles.map((g) => `<span class=\"spk ${g.kind}\" style=\"position: absolute; ${g.style}\"><\/span>`).join('');\n\n  // Cards\n  const SNOW = '<path d=\"M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5\"><\/path>';\n  $('stage').innerHTML = V.cards.map(() => `\n    <button class=\"card\" type=\"button\">\n      <span class=\"face\">\n        <span class=\"grooves\"><\/span>\n        <span class=\"flare\"><\/span>\n        <span class=\"rim\"><\/span>\n        <span class=\"crow top\">\n          <span class=\"cname\"><\/span>\n          <svg class=\"ic contactless\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 9.5c1.3 1.5 1.3 3.5 0 5M10.5 7.5c2.3 2.7 2.3 6.3 0 9M14 5.5c3.3 3.8 3.3 9.2 0 13\"><\/path><\/svg>\n        <\/span>\n        <span class=\"chip\"><\/span>\n        <span class=\"num\"><\/span>\n        <span class=\"crow bot\"><span class=\"holder\">BASHIR<\/span><span class=\"tier\"><\/span><\/span>\n        <span class=\"frost\" style=\"display:none\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">${SNOW}<\/svg><span>Frozen<\/span><\/span>\n        <span class=\"dim\"><\/span>\n        <span class=\"sweep\"><\/span>\n        <span class=\"shade\"><\/span>\n      <\/span>\n    <\/button>`).join('');\n  const cardEls = [...$('stage').children].map((btn, i) => {\n    btn.addEventListener('click', () => { if (!comp.moved && !V.open) popCard(i); V.cards[i].pick(); });\n    const q = (s) => btn.querySelector(s);\n    return { btn, face: q('.face'), flare: q('.flare'), name: q('.cname'), num: q('.num'), tier: q('.tier'), frost: q('.frost'), dim: q('.dim'), sweep: q('.sweep'), shade: q('.shade') };\n  });\n\n  function popCard(i) {\n    const el = cardEls[i];\n    el.pop = true;\n    el.sweep.classList.remove('glint');\n    void el.sweep.offsetWidth;\n    el.sweep.classList.add('glint');\n    comp.forceUpdate();\n    clearTimeout(el.popTimer);\n    // glint stays on once played: removing it would restart the intro sweep animation.\n    el.popTimer = setTimeout(() => { el.pop = false; comp.forceUpdate(); }, 600);\n  }\n\n  // Events (handlers are read from the latest render, like the original bindings)\n  const app = $('app');\n  app.addEventListener('pointerdown', (e) => V.onDown(e));\n  app.addEventListener('pointermove', (e) => V.onMove(e));\n  app.addEventListener('pointerup', (e) => V.onUp(e));\n  app.addEventListener('pointerleave', (e) => V.onUp(e));\n  app.addEventListener('pointercancel', (e) => V.onUp(e));\n  $('titleBtn').addEventListener('click', () => V.replay());\n  $('closeBtn').addEventListener('click', () => V.close());\n  $('homeBackBtn').addEventListener('click', () => { window.__nav('/'); });\n  $('freezeBtn').addEventListener('click', () => V.toggleFreeze());\n  $('revealBtn').addEventListener('click', () => V.toggleReveal());\n  $('vaultSub').textContent = `${V.cards.length} cards in your vault · tap to relight`;\n\n  const RECORDS_KEY = 'bank-cards-records';\n\n  // Account records: { [cardId]: { accounts: [{ id, name, number, balance, createdAt, tx: [...] }] } }\n  // Amounts are stored in cents. Saved in this browser (localStorage).\n  const CUR = 'Sh ';\n  const MASK = '••••••';\n  let records = {};\n  let loaded = false;\n  let loadFailed = false;\n  let ver = 0;\n\n  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\n  const num = (c) => (c < 0 ? '−' : '') + (Math.abs(c) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  const money = (c) => (c < 0 ? '−' : '') + CUR + num(Math.abs(c));\n  const day = (iso) => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });\n  const when = (iso) => day(iso) + ', ' + new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });\n  const acctNo = (n, reveal) => (reveal ? n : '•••• ' + n.slice(-4));\n  const acctsOf = (cardId) => (records[cardId] && records[cardId].accounts) || [];\n  const findAcct = (cardId, id) => acctsOf(cardId).find((a) => a.id === id);\n  const lastTx = (a) => a.tx[a.tx.length - 1];\n  const cardOf = (cardId) => comp.data().cards.find((c) => c.id === cardId);\n  // \"1,500.50\" → 150050 cents; NaN when it isn't a plain amount with up to 2 decimals.\n  const parseAmt = (str) => {\n    const t = String(str).replace(/[\\s,]/g, '');\n    return /^\\d+(\\.\\d{0,2})?$/.test(t) ? Math.round(parseFloat(t) * 100) : NaN;\n  };\n\n  let toastTimer = null;\n  function toast(msg) {\n    const el = $('toast');\n    el.textContent = msg;\n    el.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);\n  }\n\n  let saving = Promise.resolve();\n  function commit() {\n    ver++;\n    comp.forceUpdate();\n    const body = JSON.stringify(records);\n    saving = saving\n      .then(() => localStorage.setItem(RECORDS_KEY, body))\n      .catch(() => toast(\"Couldn't save. Is this browser's storage full or blocked?\"));\n  }\n\n  Promise.resolve()\n    .then(() => JSON.parse(localStorage.getItem(RECORDS_KEY) || '{}'))\n    .then((d) => { records = d && typeof d === 'object' && !Array.isArray(d) ? d : {}; loaded = true; })\n    .catch(() => { loadFailed = true; })\n    .then(() => { ver++; comp.forceUpdate(); });\n\n  // Edits wait until the saved records have loaded, so a save can never wipe them.\n  function ready() {\n    if (loaded) return true;\n    toast(loadFailed ? \"Records didn't load. Reload the page.\" : 'Still loading your records…');\n    return false;\n  }\n\n  // Bottom sheet: { view: 'add' | 'move' | 'acct', cardId, acctId?, kind?, back? }\n  const wrap = $('sheetWrap');\n  const sheetEl = $('sheet');\n  let sheet = null;\n  let sheetReveal = false;\n\n  function openSheet(s) {\n    sheet = s;\n    renderSheet();\n    if (!sheet) return;\n    wrap.classList.add('show');\n    wrap.setAttribute('aria-hidden', 'false');\n    const f = sheetEl.querySelector('input, select');\n    if (f && window.matchMedia('(pointer: fine)').matches) f.focus();\n    else sheetEl.focus();\n  }\n\n  function closeSheet() {\n    sheet = null;\n    wrap.classList.remove('show');\n    wrap.setAttribute('aria-hidden', 'true');\n    sheetEl.innerHTML = '';\n  }\n\n  const head = (title, sub, extra) => `\n    <div class=\"sheetHead\">\n      <div><div class=\"sheetTitle\" id=\"sheetTitle\">${esc(title)}<\/div>${sub ? `<div class=\"sheetSub\">${esc(sub)}<\/div>` : ''}<\/div>\n      ${extra || ''}\n    <\/div>`;\n\n  function renderSheet() {\n    const s = sheet;\n    const card = cardOf(s.cardId);\n    sheetReveal = V.reveal;\n\n    if (s.view === 'add') {\n      sheetEl.innerHTML = `\n        ${head('Add account', card.name)}\n        <form id=\"sheetForm\" novalidate>\n          <label class=\"field\">Account name<input id=\"fName\" maxlength=\"40\" autocomplete=\"off\" placeholder=\"e.g. Savings, Salary, Shopping\"><\/label>\n          <label class=\"field\">Account number (optional)<input id=\"fNumber\" maxlength=\"30\" autocomplete=\"off\"><\/label>\n          <label class=\"field\">Opening balance<input id=\"fAmt\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"0.00\"><\/label>\n          <div class=\"err\" id=\"fErr\" role=\"alert\"><\/div>\n          <div class=\"btnRow\">\n            <button class=\"btn\" type=\"button\" data-act=\"cancel\">Cancel<\/button>\n            <button class=\"btn pri\" type=\"submit\">Add account<\/button>\n          <\/div>\n        <\/form>`;\n      $('sheetForm').addEventListener('submit', (e) => {\n        e.preventDefault();\n        const name = $('fName').value.trim();\n        const number = $('fNumber').value.trim();\n        const rawAmt = $('fAmt').value.trim();\n        const opening = rawAmt ? parseAmt(rawAmt) : 0;\n        if (!name) return void ($('fErr').textContent = 'Give the account a name.');\n        if (Number.isNaN(opening)) return void ($('fErr').textContent = 'Enter the balance as a number, like 1500 or 1,500.50.');\n        const at = new Date().toISOString();\n        const acct = { id: uid(), name, number, balance: opening, createdAt: at, tx: [] };\n        if (opening > 0) acct.tx.push({ id: uid(), kind: 'open', amount: opening, note: 'Opening balance', at, after: opening });\n        if (!records[s.cardId]) records[s.cardId] = { accounts: [] };\n        records[s.cardId].accounts.push(acct);\n        commit();\n        closeSheet();\n        toast(`${name} added`);\n      });\n    }\n\n    if (s.view === 'move') {\n      const accts = acctsOf(s.cardId);\n      const isTop = s.kind === 'topup';\n      const fixed = s.acctId && findAcct(s.cardId, s.acctId);\n      sheetEl.innerHTML = `\n        ${head(isTop ? 'Top up' : 'Deduct', fixed ? `${fixed.name} · ${card.name}` : card.name)}\n        <form id=\"sheetForm\" novalidate>\n          ${fixed ? '' : `<label class=\"field\">Account<select id=\"fAcct\">${accts.map((a) => `<option value=\"${esc(a.id)}\">${esc(a.name)}<\/option>`).join('')}<\/select><\/label>`}\n          <div class=\"hintLine\" id=\"fBal\"><\/div>\n          <label class=\"field\">Amount<input id=\"fAmt\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"0.00\"><\/label>\n          <label class=\"field\">Note (optional)<input id=\"fNote\" maxlength=\"60\" autocomplete=\"off\" placeholder=\"${isTop ? 'e.g. Salary, transfer in' : 'e.g. Rent, groceries'}\"><\/label>\n          <div class=\"err\" id=\"fErr\" role=\"alert\"><\/div>\n          <div class=\"btnRow\">\n            <button class=\"btn\" type=\"button\" data-act=\"cancel\">Cancel<\/button>\n            <button class=\"btn pri\" type=\"submit\">${isTop ? 'Top up' : 'Deduct'}<\/button>\n          <\/div>\n        <\/form>`;\n      const current = () => fixed || findAcct(s.cardId, $('fAcct').value);\n      const showBal = () => { $('fBal').textContent = 'Current balance: ' + (V.reveal ? money(current().balance) : CUR + MASK); };\n      showBal();\n      if (!fixed) $('fAcct').addEventListener('change', showBal);\n      $('sheetForm').addEventListener('submit', (e) => {\n        e.preventDefault();\n        const a = current();\n        const amount = parseAmt($('fAmt').value);\n        if (!(amount > 0)) return void ($('fErr').textContent = 'Enter an amount above zero, like 1500 or 1,500.50.');\n        if (!isTop && amount > a.balance) return void ($('fErr').textContent = `That's more than ${a.name}'s balance${V.reveal ? ` of ${money(a.balance)}` : ''}.`);\n        a.balance += isTop ? amount : -amount;\n        a.tx.push({ id: uid(), kind: s.kind, amount, note: $('fNote').value.trim(), at: new Date().toISOString(), after: a.balance });\n        commit();\n        toast(`${isTop ? 'Topped up' : 'Deducted'} ${money(amount)} ${isTop ? 'to' : 'from'} ${a.name}`);\n        if (s.back) openSheet({ view: 'acct', cardId: s.cardId, acctId: a.id });\n        else closeSheet();\n      });\n    }\n\n    if (s.view === 'acct') {\n      const a = findAcct(s.cardId, s.acctId);\n      if (!a) return closeSheet();\n      const rv = V.reveal;\n      const label = { open: 'Opening balance', topup: 'Top up', deduct: 'Deduct' };\n      const rows = a.tx.slice().reverse().map((t) => {\n        const plus = t.kind !== 'deduct';\n        return `\n          <div class=\"tx\">\n            <span class=\"txIco\">${plus ? '+' : '−'}<\/span>\n            <span class=\"txMain\"><span class=\"txT\">${esc(t.note || label[t.kind])}<\/span><span class=\"txS\">${esc(when(t.at))}${rv ? ' · Balance ' + esc(money(t.after)) : ''}<\/span><\/span>\n            <span class=\"amt ${plus ? 'pos' : ''}\">${rv ? (plus ? '+' : '−') + esc(money(t.amount)) : CUR + MASK}<\/span>\n          <\/div>`;\n      }).join('');\n      sheetEl.innerHTML = `\n        ${head(a.name, [card.name, a.number ? acctNo(a.number, rv) : ''].filter(Boolean).join(' · '),\n          `<button class=\"linkBtn\" type=\"button\" data-act=\"reveal\" aria-pressed=\"${rv}\">${rv ? 'Hide' : 'Show'}<\/button>`)}\n        <div class=\"sheetBal\">${rv ? esc(money(a.balance)) : CUR + MASK}<\/div>\n        <div class=\"btnRow\">\n          <button class=\"btn pri\" type=\"button\" data-act=\"topup\">Top up<\/button>\n          <button class=\"btn\" type=\"button\" data-act=\"deduct\">Deduct<\/button>\n        <\/div>\n        <div class=\"hist\">\n          <div class=\"histTitle\">History<\/div>\n          ${rows || '<div class=\"histEmpty\">No activity yet<\/div>'}\n        <\/div>\n        <div class=\"btnRow\">\n          <button class=\"btn danger\" type=\"button\" data-act=\"delete\">Delete account<\/button>\n          <button class=\"btn\" type=\"button\" data-act=\"cancel\">Close<\/button>\n        <\/div>`;\n    }\n  }\n\n  sheetEl.addEventListener('click', (e) => {\n    const b = e.target.closest('[data-act]');\n    if (!b || !sheet) return;\n    const act = b.dataset.act;\n    if (act === 'cancel') {\n      if (sheet.back) openSheet({ view: 'acct', cardId: sheet.cardId, acctId: sheet.acctId });\n      else closeSheet();\n    } else if (act === 'reveal') {\n      V.toggleReveal();\n    } else if (act === 'topup' || act === 'deduct') {\n      openSheet({ view: 'move', kind: act, cardId: sheet.cardId, acctId: sheet.acctId, back: true });\n    } else if (act === 'delete') {\n      // Two taps to delete, so a stray tap can't lose an account's history.\n      if (!b.dataset.armed) {\n        b.dataset.armed = '1';\n        b.textContent = 'Tap again to delete';\n        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Delete account'; } }, 3000);\n        return;\n      }\n      const list = acctsOf(sheet.cardId);\n      const i = list.findIndex((a) => a.id === sheet.acctId);\n      const name = list[i].name;\n      list.splice(i, 1);\n      commit();\n      closeSheet();\n      toast(`${name} deleted`);\n    }\n  });\n  // Keep taps and drags inside the sheet from reaching the card-swipe handlers.\n  ['pointerdown', 'pointermove', 'pointerup'].forEach((t) => wrap.addEventListener(t, (e) => e.stopPropagation()));\n  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });\n  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet) closeSheet(); });\n\n  function startAdd() {\n    if (ready()) openSheet({ view: 'add', cardId: V.acard.id });\n  }\n  function startMove(kind) {\n    if (!ready()) return;\n    const cardId = V.acard.id;\n    const accts = acctsOf(cardId);\n    if (!accts.length) {\n      toast('Add an account to this card first');\n      return openSheet({ view: 'add', cardId });\n    }\n    openSheet({ view: 'move', kind, cardId, acctId: accts.length === 1 ? accts[0].id : null });\n  }\n  $('addAcctBtn').addEventListener('click', startAdd);\n  // Tap the home total to hide or show the amounts; remembered on this device only.\n  let totalHidden = false;\n  try { totalHidden = localStorage.getItem('wallet-total-hidden') === '1'; } catch (e) {}\n  $('allTotal').addEventListener('click', () => {\n    if (comp.moved) return;\n    totalHidden = !totalHidden;\n    try { localStorage.setItem('wallet-total-hidden', totalHidden ? '1' : '0'); } catch (e) {}\n    comp.forceUpdate();\n  });\n  $('addAcctBtn2').addEventListener('click', startAdd);\n  $('topupBtn').addEventListener('click', () => startMove('topup'));\n  $('deductBtn').addEventListener('click', () => startMove('deduct'));\n  const acctList = $('acctList');\n  // Scrolling the list shouldn't count as a swipe-down to close the card.\n  acctList.addEventListener('pointerdown', (e) => e.stopPropagation());\n  acctList.addEventListener('click', (e) => {\n    if (e.target.closest('[data-act=\"add\"]')) return startAdd();\n    const row = e.target.closest('[data-id]');\n    if (row) openSheet({ view: 'acct', cardId: V.acard.id, acctId: row.dataset.id });\n  });\n\n  let listKey = '';\n  function apply(v) {\n    app.className = ['app', v.litCls, v.openCls].filter(Boolean).join(' ');\n    $('ambient').style.background = v.ambientBg;\n    const db = $('detailBg');\n    db.style.opacity = v.p;\n    db.style.background = v.detailBg;\n\n    v.cards.forEach((c, i) => {\n      const el = cardEls[i];\n      el.btn.style.cssText = 'will-change: transform; ' + c.style;\n      el.btn.setAttribute('aria-label', c.aria);\n      el.face.style.background = c.bg;\n      el.face.className = (c.art ? `face has-art art-${c.art}` : 'face') + (el.pop ? ' pop' : '');\n      el.flare.style.background = c.flare;\n      el.name.textContent = c.name;\n      el.num.textContent = c.num;\n      el.tier.textContent = c.tier;\n      el.frost.style.display = c.frozen ? 'flex' : 'none';\n      el.dim.style.opacity = c.dim;\n      el.sweep.style.animationDelay = c.sweepDelay + 'ms';\n      el.shade.style.transitionDelay = c.shadeDelay + 'ms';\n    });\n\n    $('home').style.cssText = 'will-change: opacity; ' + v.homeStyle;\n    $('labName').textContent = v.labName;\n    // Home: the shown card's own total under its name, and the grand total across every card.\n    const cardSum = (id) => acctsOf(id).reduce((sum, a) => sum + a.balance, 0);\n    $('labSub').textContent = v.labSub + (loaded ? ' · ' + (totalHidden ? CUR + MASK : money(cardSum(v.labId))) : '');\n    const allCards = comp.data().cards;\n    const acctCount = allCards.reduce((n, c) => n + acctsOf(c.id).length, 0);\n    $('atVal').textContent = !loaded ? (loadFailed ? '—' : '…') : totalHidden ? MASK : num(allCards.reduce((sum, c) => sum + cardSum(c.id), 0));\n    $('atSub').textContent = !loaded ? (loadFailed ? \"Couldn't load records\" : 'Loading…')\n      : `${acctCount} account${acctCount === 1 ? '' : 's'} across ${allCards.length} cards`;\n    $('atEye').textContent = totalHidden ? 'Show' : 'Hide';\n    $('allTotal').setAttribute('aria-pressed', String(!totalHidden));\n\n    ['d0', 'd1', 'd2', 'd3'].forEach((id) => { $(id).style.cssText = 'will-change: opacity; ' + v[id]; }); c(a.name.trim().charAt(0).toUpperCase() || '?')}<\/span>\n          <span class=\"txMain\"><span class=\"txT\">${esc(a.name)}<\/span><span class=\"txS\">${esc(sub)}<\/span><\/span>\n          <span class=\"amt\">${v.reveal ? money(a.balance) : CUR + MASK}<\/span>\n        <\/button>`;\n          }).join('');\n    }\n\n    if (sheet && !v.open) closeSheet();\n    else if (sheet && sheet.view === 'acct' && v.reveal !== sheetReveal) renderSheet();\n  }\n\n  let queued = false;\n  __schedule = () => {\n    if (queued) return;\n    queued = true;\n    requestAnimationFrame(() => { queued = false; V = comp.renderVals(); apply(V); });\n  };\n\n  // Fit the 390×844 phone screen to any window\n  const fit = $('fit');\n  function resize() {\n    const s = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1.25);\n    fit.style.width = (390 * s) + 'px';\n    fit.style.height = (844 * s) + 'px';\n    app.style.transform = `scale(${s})`;\n  }\n  // transform on .app is set by resize; keep it out of the per-frame cssText writes\n  window.addEventListener('resize', resize);\n  resize();\n\n  apply(V);\n  if (comp.componentDidMount) comp.componentDidMount();\n})();\n<\/script>\n<\/body>\n<\/html>\n" }
};
var frame = document.getElementById("screen");

function current() {
  var p = location.hash.replace(/^#/, "") || "/";
  return SCREENS[p] ? p : "/";
}
function show() {
  var s = SCREENS[current()];
  document.title = "BANK Cards · " + s.title;
  frame.title = s.title;
  frame.srcdoc = s.html;
}
window.addEventListener("message", function (e) {
  if (e.source !== frame.contentWindow || !e.data || typeof e.data.bankNav !== "string") return;
  var to = SCREENS[e.data.bankNav] ? e.data.bankNav : "/";
  if (to === current()) show(); else location.hash = to;
});
